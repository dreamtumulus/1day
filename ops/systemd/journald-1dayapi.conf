# journald retention for the 1dayAPI main server (docs/operations.md §7.3).
# Install as /etc/systemd/journald.conf.d/10-1dayapi.conf, then: systemctl restart systemd-journald
#
# Why: ops/bin/canary-verify, ops/bin/health and every incident review assume at least 24 h of gateway / console
# logs, and the iron rules ask for a >= 24 h observation window per canary round. Production was found keeping
# about 4 h (2026-10: the default cap is 10 % of the filesystem but at most 4 G *shared by all units*, and the
# gateway logs every request). Target: >= 14 days on disk, hard limit 30 days.
#
# Sizing: 4G is the review's starting value, NOT a measured one. Measure before trusting it:
#   journalctl --disk-usage                      # what the journal uses now
#   journalctl --header | grep -m3 -E 'File path|Head realtime'   # how far back the current files reach
#   systemd-analyze cat-config systemd/journald.conf            # which limits are in force today
# Required size ~= (current usage / hours currently retained) x 336 h. If journald already runs with the 4G
# default cap and still holds only ~4 h, 14 days will not fit in any sane SystemMaxUse: then the volume has to
# come down first (the gateway unit sets TUNNEL_TRACE=1; per-request logging) and this file alone is not the fix.
# `ops/bin/health-extra` prints the retained span on every run; raise SystemMaxUse until it reads >= 14 d.
[Journal]
Storage=persistent
Compress=yes
# Total size of the persistent journal. journald deletes the oldest files beyond this.
SystemMaxUse=4G
# Never let the journal eat the last free space (database and backups live on the same filesystem).
SystemKeepFree=20G
# Rotate in pieces small enough that vacuuming is fine-grained.
SystemMaxFileSize=128M
# Time limit: nothing older than 30 days stays, whatever the size.
MaxRetentionSec=30day
# The gateway logs in bursts (streams, retries); the default 10000 msgs / 30 s per service drops lines silently.
RateLimitIntervalSec=30s
RateLimitBurst=50000

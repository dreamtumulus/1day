# Live gateway instance (installed at /etc/nginx/conf.d/1dayapi-gateway-upstream.conf).
# The port on the `server` line is flipped between the two blue/green instances by
# /opt/1dayapi/ops/bin/gateway-switch (zero-downtime releases; docs/operations.md §4).
# Keep port numbers out of the comments: the script reads the port from the `server` line only.
upstream gateway_live {
    server 127.0.0.1:8400;
}
